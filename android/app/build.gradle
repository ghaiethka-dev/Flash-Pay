plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// معلومات مفتاح التوقيع (release keystore) - لا يتم رفعها إلى git
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    // ⚠️ يفضّل تغييره قبل أول رفع للمتجر (راجع الشرح في الرسالة عن سبب عدم استخدام com.example)
    namespace "com.flashpay.sy"
    // تم تثبيت compileSdk/targetSdk = 36 صراحة بدل الاعتماد على قيمة Flutter الافتراضية
    // لضمان التوافق مع متطلبات Google Play (يجب الاستهداف Android 16 / API 36 بحلول 31 أغسطس 2026)
    compileSdk 36
    // NDK بإصدار يدعم محاذاة 16KB memory page size (مطلوب لأي مكتبات native .so)
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.flashpay.sy"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // يستخدم مفتاح التوقيع الحقيقي (release keystore) بدل مفتاح debug
            // بشرط وجود ملف android/key.properties (راجع خطوات إنشائه في الرسالة)
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        // يضمن عدم ضغط المكتبات native حتى تبقى محاذاة 16KB سليمة
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

flutter {
    source '../..'
}